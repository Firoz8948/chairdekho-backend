name: Deploy backend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          # GitHub runners are not on your home IP — SG must allow 22 from 0.0.0.0/0 (or a tunnel)
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/chairdekho/backend
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker compose ps
            curl -fsS --retry 15 --retry-delay 4 --retry-connrefused http://127.0.0.1:8000/health
            docker image prune -f
